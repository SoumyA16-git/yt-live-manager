<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — 24×7 YouTube Vertical Live Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
      background: radial-gradient(circle at 50% 10%, #18181b 0%, #09090b 85%);
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .login-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-muted);
      border-radius: var(--radius-md);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      padding: 2rem 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.65rem;
    }

    .login-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .login-header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .error-box {
      display: none;
      background: var(--status-error-bg);
      border: 1px solid rgba(244, 63, 94, 0.4);
      color: #fb7185;
      padding: 0.65rem 0.85rem;
      border-radius: var(--radius-xs);
      font-size: 0.8rem;
      text-align: center;
      font-family: var(--font-mono);
    }

    .login-footer {
      text-align: center;
      font-size: 0.725rem;
      color: var(--text-dim);
      font-family: var(--font-mono);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div style="display: flex; align-items: center; gap: 0.5rem;">
          <span class="logo-badge">24×7</span>
          <svg class="icon icon-lg" viewBox="0 0 24 24" style="color: var(--accent-primary);"><path d="M4.9 19.1C1 15.2 1 8.8 4.9 4.9"/><path d="M7.8 16.2c-2.3-2.3-2.3-6.1 0-8.5"/><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8c2.3 2.3 2.3 6.1 0 8.5"/><path d="M19.1 4.9C23 8.8 23 15.2 19.1 19.1"/></svg>
        </div>
        <h1>YT Live Manager Console</h1>
        <p>Authenticate to access streaming telemetry</p>
      </div>

      <div id="error-message" class="error-box"></div>

      <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="admin" required autofocus autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; margin-top: 0.25rem;">
          <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In to Console
        </button>
      </form>
    </div>

    <div class="login-footer">
      24×7 YouTube Vertical Live Manager · OCI E2.1.Micro
    </div>
  </div>

  <script type="module" src="/js/login.js"></script>
</body>
</html>
