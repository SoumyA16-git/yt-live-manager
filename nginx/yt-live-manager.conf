# /etc/nginx/sites-available/yt-live-manager.conf
# Reference reverse proxy configuration per PRD §21.4

server {
  listen 443 ssl http2;
  server_name example.com;

  # ssl_certificate / ssl_certificate_key managed via certbot
  # ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  client_max_body_size 4g;

  # Streaming multipart upload: disable request buffering so uploads stream directly to Node.js
  location /api/videos/upload {
    proxy_pass http://127.0.0.1:3000;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}

server {
  listen 80;
  server_name example.com;
  return 301 https://$host$request_uri;
}
